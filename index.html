<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js Galaxy</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  canvas { display: block; }
  #intro {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; color: #dfe6ff;
    background: rgba(5, 6, 15, .55); backdrop-filter: blur(2px); font-family: system-ui, sans-serif;
  }
  #intro h1 { margin: 0; font-size: 40px; letter-spacing: .04em; }
  #intro p { margin: 0 0 20px; color: #9aa4d6; }
  #start {
    padding: 12px 32px; font-size: 18px; color: #fff; cursor: pointer;
    border: 1px solid #7f93ff; border-radius: 999px; background: #1b2260;
    box-shadow: 0 0 24px #4a6dff88; transition: transform .15s;
  }
  #start:hover { transform: scale(1.06); }
  #hint {
    position: fixed; left: 16px; bottom: 12px; color: #9aa4d6;
    font: 13px/1.4 system-ui, sans-serif; pointer-events: none; opacity: .8;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="intro">
  <h1>Three.js Galaxy</h1>
  <p>은하 · 행성 · 우주선</p>
  <button id="start">▶ 시작</button>
</div>
<div id="hint">마우스 드래그: 회전 · 휠: 확대/축소 · C: 우주선 추적 시점</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060f, 0.035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 6, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// --- 은하 파티클 ---
const COUNT = 30000, ARMS = 4, RADIUS = 10;
const pos = new Float32Array(COUNT * 3);
const col = new Float32Array(COUNT * 3);
const inner = new THREE.Color('#ffb36b'), outer = new THREE.Color('#4a6dff');
for (let i = 0; i < COUNT; i++) {
  const r = Math.pow(Math.random(), 1.5) * RADIUS;
  const arm = ((i % ARMS) / ARMS) * Math.PI * 2;
  const spin = r * 0.7;
  const rnd = () => Math.pow(Math.random(), 3) * (Math.random() < .5 ? 1 : -1) * 0.5 * (0.3 + r * 0.15);
  pos[i*3]   = Math.cos(arm + spin) * r + rnd();
  pos[i*3+1] = rnd() * 0.6;
  pos[i*3+2] = Math.sin(arm + spin) * r + rnd();
  const c = inner.clone().lerp(outer, r / RADIUS);
  col.set([c.r, c.g, c.b], i * 3);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const galaxy = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 0.045, vertexColors: true, sizeAttenuation: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(galaxy);

// --- 중앙 토러스 매듭 ---
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(0.9, 0.28, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0xffd2a1, emissive: 0xff7a1a, emissiveIntensity: 0.9, metalness: 0.6, roughness: 0.25 })
);
scene.add(knot);
const light = new THREE.PointLight(0xffa860, 40, 30);
scene.add(light, new THREE.AmbientLight(0x334066, 0.6));

// --- 궤도를 도는 행성 ---
const planets = [
  { r: 3.5, s: 0.9, size: 0.22, color: 0x66e0ff },
  { r: 5.5, s: 0.55, size: 0.32, color: 0xff6b9a },
  { r: 7.5, s: 0.35, size: 0.28, color: 0xb6ff7a },
].map(p => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(p.size, 32, 32),
    new THREE.MeshStandardMaterial({ color: p.color, emissive: p.color, emissiveIntensity: 0.5 })
  );
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(p.r - 0.01, p.r + 0.01, 128),
    new THREE.MeshBasicMaterial({ color: 0x8899ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  ring.rotation.x = Math.PI / 2;
  scene.add(m, ring);
  return { ...p, mesh: m };
});

// --- 배경 별 ---
const bg = new Float32Array(3000 * 3);
for (let i = 0; i < bg.length; i++) bg[i] = (Math.random() - 0.5) * 120;
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.BufferAttribute(bg, 3));
scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: 0.6, fog: false })));

// --- 우주선 ---
const shipPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-14, 3, 10), new THREE.Vector3(-6, -1, 5), new THREE.Vector3(-2, 0.5, 6.5),
  new THREE.Vector3(5, 1.5, 4), new THREE.Vector3(12, 4, -2), new THREE.Vector3(7, -1, -9),
  new THREE.Vector3(-2, 1, -6), new THREE.Vector3(-9, 3, -8), new THREE.Vector3(-15, 1, 0),
], true, 'catmullrom', 0.5);

const ship = new THREE.Group();
const hullMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ff, metalness: 0.8, roughness: 0.3 });
const body = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.9, 16), hullMat);
body.rotation.x = Math.PI / 2;               // 원뿔 끝이 +z(진행 방향)
const wings = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.025, 0.28), hullMat);
wings.position.z = -0.25;
const fin = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.2, 0.25), hullMat);
fin.position.set(0, 0.1, -0.3);
const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0x66e0ff, emissive: 0x2299ff, emissiveIntensity: 1 }));
cockpit.position.set(0, 0.07, 0.1);
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.5, 12),
  new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending }));
flame.rotation.x = -Math.PI / 2;             // 뒤쪽(-z)으로 분사
flame.position.z = -0.7;
const shipLight = new THREE.PointLight(0x66ccff, 3, 4);
shipLight.position.z = -0.6;
ship.add(body, wings, fin, cockpit, flame, shipLight);
ship.scale.setScalar(1.4);
scene.add(ship);

// 궤적(꼬리)
const TRAIL = 160;
const trailPos = new Float32Array(TRAIL * 3);
const trailCol = new Float32Array(TRAIL * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
scene.add(new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size: 0.09, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
})));
let trailInit = false;

// 카메라 모드: C 키 또는 클릭 버튼으로 우주선 추적 전환
let follow = false;
const toggleFollow = () => {
  follow = !follow;
  controls.enabled = !follow;
  btn.textContent = follow ? '자유 시점' : '우주선 추적';
};
const btn = document.createElement('button');
btn.textContent = '우주선 추적';
btn.style.cssText = 'position:fixed;right:16px;bottom:12px;padding:8px 14px;border:1px solid #5566aa;border-radius:8px;background:#11163a;color:#cfd6ff;font:13px system-ui;cursor:pointer';
btn.onclick = toggleFollow;
document.body.appendChild(btn);
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'c') toggleFollow(); });

const _p = new THREE.Vector3(), _q = new THREE.Vector3(), _cam = new THREE.Vector3();
const clock = new THREE.Clock(false);
const animate = () => {
  const t = clock.getElapsedTime();

  const u = (t * 0.02) % 1;
  shipPath.getPointAt(u, _p);
  shipPath.getPointAt((u + 0.004) % 1, _q);
  ship.position.copy(_p);
  ship.lookAt(_q);
  ship.rotateZ(Math.sin(t * 0.7) * 0.35);    // 완만한 롤
  flame.scale.set(1, 0.8 + Math.random() * 0.5, 1);

  // 꼬리: 기록을 한 칸씩 뒤로 밀고 맨 앞에 현재 위치
  trailPos.copyWithin(3, 0, (TRAIL - 1) * 3);
  if (!trailInit) { for (let i = 0; i < TRAIL; i++) trailPos.set([_p.x, _p.y, _p.z], i * 3); trailInit = true; }
  trailPos.set([_p.x, _p.y, _p.z], 0);
  for (let i = 0; i < TRAIL; i++) {
    const f = 1 - i / TRAIL;
    trailCol.set([0.3 * f, 0.7 * f, 1 * f], i * 3);
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  if (follow) {
    _cam.set(0, 1.2, -4).applyMatrix4(ship.matrixWorld);
    camera.position.lerp(_cam, 0.08);
    _q.set(0, 0, 6).applyMatrix4(ship.matrixWorld);
    camera.lookAt(_q);
  }

  galaxy.rotation.y = t * 0.05;
  knot.rotation.x = t * 0.5;
  knot.rotation.y = t * 0.8;
  knot.scale.setScalar(1 + Math.sin(t * 2) * 0.06);
  light.intensity = 40 + Math.sin(t * 3) * 8;
  for (const p of planets) {
    const a = t * p.s;
    p.mesh.position.set(Math.cos(a) * p.r, Math.sin(a * 2) * 0.3, Math.sin(a) * p.r);
  }
  if (!follow) controls.update();
  renderer.render(scene, camera);
};

// 시작 화면: 버튼을 누르면 애니메이션 실행
renderer.render(scene, camera);
const startBtn = document.getElementById('start');
startBtn.addEventListener('click', () => {
  document.getElementById('intro').remove();
  clock.start();
  renderer.setAnimationLoop(animate);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
